[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-jailbreak-defense"
version = "0.1.0"
description = "Runtime defense pipeline for RAG jailbreak and prompt-injection attacks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Capstone Student" }]
license = { text = "MIT" }
keywords = ["rag", "security", "llm", "jailbreak", "prompt-injection"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
